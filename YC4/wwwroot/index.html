<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC - Hệ thống Phân quyền Concert</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 2rem; margin-bottom: 0.5rem; text-align: center; font-weight: 600; }
        p.subtitle { color: #94a3b8; text-align: center; margin-bottom: 2rem; font-size: 0.9rem; }

        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #cbd5e1; font-size: 0.85rem; }
        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }
        button:hover { background: var(--primary-dark); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .error { color: #f87171; font-size: 0.85rem; margin-top: 1rem; text-align: center; min-height: 1.2rem; }

        .demo-accounts {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .demo-accounts b { color: var(--primary); }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Đăng nhập để trải nghiệm hệ thống phân quyền</p>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Nhập tài khoản (admin hoặc user)">
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu (admin123)">
        </div>

        <button onclick="login()">Đăng Nhập</button>
        <div id="error" class="error"></div>

        <div class="demo-accounts">
            <p>Tài khoản demo:</p>
            <p>Admin: <b>admin</b> / <b>admin123</b></p>
            <p>User: <b>user</b> / <b>user123</b></p>
        </div>
    </div>

    <script>
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            errorDiv.innerText = '';

            try {
                const response = await fetch('/api/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userName: user, password: pass })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    
                    // Redirect based on role
                    if (result.user.roles.includes('Admin')) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'concerts.html';
                    }
                } else {
                    errorDiv.innerText = result.message || 'Sai tài khoản hoặc mật khẩu';
                }
            } catch (err) {
                errorDiv.innerText = 'Không thể kết nối tới server';
            }
        }
    </script>
</body>
</html>
